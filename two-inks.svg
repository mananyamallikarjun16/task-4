<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1450" viewBox="0 0 1000 1450"><title>two inks</title><rect x="0" y="0" width="1000" height="1450" fill="#F6EFDA"/><text x="60" y="75" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#202820">FOLD PRESS     /     COLOUR LAB</text><rect x="60" y="104" width="880" height="3" fill="#202820"/><text x="50" y="242" font-family="DejaVu Serif" font-size="99" font-weight="bold" fill="#202820">Two inks,</text><text x="50" y="355" font-family="DejaVu Serif" font-size="99" font-weight="bold" fill="#202820">three colours.</text><text x="60" y="430" font-family="DejaVu Sans" font-size="29" font-weight="normal" fill="#202820">How transparent spot colours overlap on paper.</text><rect x="60" y="510" width="880" height="2" fill="#202820"/><text x="60" y="574" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#CC452D">01</text><text x="60" y="629" font-family="DejaVu Sans" font-size="39" font-weight="bold" fill="#202820">Lay down gold</text><text x="60" y="683" font-family="DejaVu Sans" font-size="21" font-weight="normal" fill="#202820">The first plate prints a gold disc.</text><circle cx="765" cy="630" r="65" fill="#E3AC28"/><rect x="60" y="760" width="880" height="2" fill="#202820"/><text x="60" y="824" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#CC452D">02</text><text x="60" y="879" font-family="DejaVu Sans" font-size="39" font-weight="bold" fill="#202820">Add blue</text><text x="60" y="933" font-family="DejaVu Sans" font-size="21" font-weight="normal" fill="#202820">A second plate prints a blue disc, offset to the right.</text><circle cx="829" cy="880" r="65" fill="#55A6B4"/><rect x="60" y="1010" width="880" height="2" fill="#202820"/><text x="60" y="1074" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#CC452D">03</text><text x="60" y="1129" font-family="DejaVu Sans" font-size="39" font-weight="bold" fill="#202820">Read the overlap</text><text x="60" y="1183" font-family="DejaVu Sans" font-size="21" font-weight="normal" fill="#202820">Light passes through both inks in the shared area.</text><circle cx="765" cy="1130" r="65" fill="#E3AC28"/><circle cx="829" cy="1130" r="65" fill="#55A6B4"/><clipPath id="overlap"><circle cx="765" cy="1130" r="65" fill="white"/></clipPath><g clip-path="url(#overlap)"><circle cx="829" cy="1130" r="65" fill="#537D43"/></g><rect x="60" y="1260" width="880" height="3" fill="#202820"/><text x="60" y="1325" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#202820">Gold + blue → green in the overlap.</text><text x="60" y="1383" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#202820">Illustrative colours. Actual results depend on ink, paper and coverage.</text></svg>